name: Auto Sync Website Knowledge

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Scrape website and update knowledge
        run: node sync.js

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data/knowledge.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update website knowledge [skip ci]" && git push)
