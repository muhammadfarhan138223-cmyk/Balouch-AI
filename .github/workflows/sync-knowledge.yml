name: Auto Sync Public Project Knowledge
on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-knowledge
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sync allowlisted public sources
        run: node sync.js
      - name: Commit public snapshots
        run: |
          git config user.email "Muhammadfarhan138223@gmail.com"
          git config user.name "Farhan Studio"
          git add data/project-knowledge.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh public project knowledge snapshots"
            git pull --rebase origin main
            git push
          fi
