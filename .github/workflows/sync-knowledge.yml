name: Auto Sync Website Knowledge

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-knowledge
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install browser (site is JavaScript-rendered)
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Crawl website and replace knowledge
        run: node sync.js

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data/knowledge.js
          if git diff --cached --quiet; then
            echo "No knowledge changes."
          else
            git commit -m "Auto-update website knowledge"
            git push
          fi
