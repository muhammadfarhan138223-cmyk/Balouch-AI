<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Balouch AI</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">
    <header>
      <div class="logo">✦</div>
      <div>
        <h1>Balouch AI</h1>
        <p>Farhan Balouch's Website AI</p>
      </div>
    </header>

    <section id="chat">
      <div class="message ai">
        👋 Hi! I'm <b>Balouch AI</b>.<br><br>
        Ask me anything about Farhan Balouch and his website.
      </div>
    </section>

    <form id="chatForm">
      <input
        id="messageInput"
        type="text"
        placeholder="Ask about Farhan..."
        autocomplete="off"
      >
      <button type="submit">➤</button>
    </form>
  </main>

  <script src="chatbot.js"></script>
</body>
</html>
